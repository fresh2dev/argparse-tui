---
name: 'Run Tests'
on:
  workflow_dispatch:
  push:
    branches-ignore: ["*"]
    tags-ignore: ["*"]
  pull_request:

concurrency:
  # group: test-${{ github.ref }}
  group: test
  cancel-in-progress: false

jobs:
  test:
    name: test with ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        os:
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: true
          submodules: true
          set-safe-directory: true

      - run: >
          git fetch --prune --tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: >
          uv sync --link-mode copy --no-sources --no-editable --all-extras --all-groups

      - name: Run tests
        run: >
          uv run --no-sync pytest --cov=./src --cov-report=term

      - name: Run doc tests
        run: >
          uv run --no-sync pytest --markdown-docs -m markdown-docs --suppress-no-test-exit-code ./src
