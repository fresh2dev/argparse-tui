[build-system]
requires = ["hatchling>=1.8.0", "uv-dynamic-versioning>=0.8.0", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.hatch.build.hooks.version]
path = "src/argparse_tui/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src"]
sources = ["src"]

[project]
name = "argparse-tui"
authors = [
    {name = "Donald Mellenbruch", email = "hello@f2dv.com"},
]
description = "Present your Argparse CLI as a Textual UI (TUI)."
readme = "README.pypi.md"
license = {file = "LICENSE"}
requires-python = ">=3.9.0"
classifiers = [
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]
dependencies = [
    "textual>=2.1.2,<3",
]

[project.optional-dependencies]
# extras = []

[dependency-groups]
dev = [
    "pdbp",
    "ipykernel",  # python -m ipykernel install --user --name argparse-tui
]
tests = [
    "pytest==8.*",
    "pytest-env==1.*",
    "pytest-cov==5.*",
    "pytest-html==4.*",
    "pytest-sugar==1.*",
    "pytest-markdown-docs==0.7.*",
    "pytest-custom-exit-code==0.3.*",
    "pytest-asyncio",
    "packaging==23.*",
    "mockish>=0.1.1,<2",
]

[tool.uv]
default-groups = ["dev", "tests"]

[tool.uv.sources]
mockish = { path = "../mockish", editable = true }

[project.urls]
Homepage = "https://fresh2.dev/r/argparse-tui"
Repository = "https://github.com/fresh2dev/argparse-tui"
# Funding = "https://fresh2.dev/fund"

[tool.pytest.ini_options]
minversion = 8.0
testpaths = ["tests"]
env = [
    "PYTHONBREAKPOINT=pdbp.set_trace",
]

[tool.docsig]
check-class = true
check-dunders = true
check-overridden = true
check-protected = true
disable = [
    "SIG101",
    "SIG102",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportUnusedImport = "none"
reportPrivateUsage = "none"
reportImplicitOverride = "none"
reportAttributeAccessIssue = "none"
reportImportCycles = "error"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportShadowedImports = "warning"

[tool.ruff]
preview = true
unsafe-fixes = true

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
docstring-code-line-length = 'dynamic'

[tool.ruff.lint]
select = [
    "A",       # flake8-builtins
    "ARG",     # flake8-unused-arguments
    "ASYNC",   # flake8-unused-arguments
    "B",       # flake8-bugbear
    "BLE",     # flake8-blind-except
    "C4",      # flake8-comprehensions
    "COM",     # flake8-commas
    "DTZ",     # flake8-datetimez
    "E",       # pycodestyle errors
    "EM",      # flake8-errmsg
    "F",       # pyflakes
    "FAST",    # FastAPI
    "FLY",     # pyflakes
    "G",       # flake8-logging-format
    "I",       # isort
    "ISC",     # flake8-implicit-str-concat
    "PERF",    # flake8-pie
    "PIE",     # flake8-pie
    "PLC",     # pylint-specific conventions
    "PLE",     # pylint-specific errors
    "PLR",     # pylint-specific refactors
    "PLW",     # pylint-specific warnings
    "PT",      # flake8-pytest-style
    "PTH",     # flake8-use-pathlib
    "Q",       # flake8-quotes
    "RET",     # flake8-return
    "RSE",     # flake8-raise
    "RUF",     # ruff-specific
    "SIM",     # flake8-simplify
    "TRY",     # tryceratops
    "UP",      # pyupgrade
    "W",       # pycodestyle warnings
]
ignore = [
    "E501",    # line too long, handled by black
    "PLR0904", # too many class methods
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments
    "PLR1702", # too many nested blocks
    "PLR2004", # magic value used in comparison
]
# fixable = []
# unfixable = []
